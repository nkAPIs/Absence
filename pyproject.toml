[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "absence"
version = "1.0.2"
description = "Absence module for get and set absence in KMD Opus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "requests>=2.32.5",
    "requests-pkcs12>=1.27",
    "zeep>=4.3.2",
]

[tool.setuptools.packages.find]
include = ["Absence*"]

[tool.setuptools.package-data]
"Absence.src.wsdl" = ["*.wsdl"]
"Absence.src.certs" = ["*.p12"]